{%extends 'base.html'%}
{%block contents%}

<section id="recommendations" class="bg-light py-5">
    <div class="container">
        <h3 align="center">User Login Form</h3>

        <form action="{%url 'UserLoginCheck'%}" method="POST" class="text-primary" style="width:100%">
            {% csrf_token %}
            <table>
                <div class="form-group row">
                    <div class="col-md-12">
                        <input type="text" class="form-control" name="loginid" required placeholder="Enter Login Id">
                    </div>
                </div>
                <div class="form-group row">
                    <div class="col-md-12">
                        <input type="password" class="form-control" name="pswd" required placeholder="Enter password">
                    </div>
                </div>
                <tr>
                    <td style="padding:20px;">
                        <button class="btn btn-block btn-primary text-white py-2 px-4"
                                type="submit">
                            Login
                        </button>
                    </td>
                    <td>
                        <button class="btn btn-block btn-primary text-white py-2 px-4"
                                type="reset">
                            Reset
                        </button>
                    </td>
                </tr>

                {% if messages %}
                {% for message in messages %}
                <font color='GREEN'> {{ message }}</font>
                {% endfor %}
                {% endif %}

            </table>

        </form>
    </div>
</section>

{%endblock%}
